<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat | MUKTI APP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #10B981;
            --primary-light: #34D399;
            --primary-dark: #059669;
            --secondary: #F59E0B;
            --accent: #F97316;
            --dark: #0f172a;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-blur: blur(20px);
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.6);
            --radius-xl: 32px;
            --radius-lg: 20px;
            --radius-pill: 50px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', 'Inter', sans-serif;
        }

        body {
            background: radial-gradient(circle at bottom left, #1e293b, #0f172a);
            background-attachment: fixed;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 20px;
        }

        .app-window {
            width: 100%;
            max-width: 900px;
            height: 90vh;
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .chat-header {
            padding: 20px 32px;
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .back-link {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            transition: all 0.3s ease;
        }

        .back-link:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(-2px);
        }

        .avatar {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
        }

        .user-details h2 {
            font-size: 1rem;
            font-weight: 600;
            color: white;
        }

        .food-tag {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .messages-viewport {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .messages-viewport::-webkit-scrollbar {
            width: 4px;
        }

        .messages-viewport::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .message-group {
            display: flex;
            flex-direction: column;
            max-width: 80%;
        }

        .message-group.me {
            align-self: flex-end;
            align-items: flex-end;
        }

        .message-group.other {
            align-self: flex-start;
            align-items: flex-start;
        }

        .bubble {
            padding: 12px 18px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.5;
            position: relative;
        }

        .me .bubble {
            background: var(--primary);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .other .bubble {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border-bottom-left-radius: 4px;
            border: 1px solid var(--glass-border);
        }

        .message-meta {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 4px;
            padding: 0 4px;
        }

        .input-bar {
            padding: 24px 32px;
            background: rgba(0, 0, 0, 0.1);
            border-top: 1px solid var(--glass-border);
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-pill);
            padding: 6px 6px 6px 20px;
        }

        .message-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: white;
            font-size: 0.95rem;
        }

        .send-button {
            width: 40px;
            height: 40px;
            background: var(--primary);
            border: none;
            border-radius: 50%;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .send-button:hover {
            transform: scale(1.1);
            background: var(--primary-light);
        }

        .system-marker {
            align-self: center;
            background: rgba(255, 255, 255, 0.03);
            padding: 4px 12px;
            border-radius: var(--radius-pill);
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 8px 0;
        }
    </style>
</head>

<body>
    <div class="app-window">
        <header class="chat-header">
            <div class="header-left">
                <a href="/chat" class="back-link"><i class="fas fa-chevron-left"></i></a>
                <div class="avatar"
                    th:text="${otherUserName != null && !otherUserName.isEmpty() ? otherUserName.substring(0, 1).toUpperCase() : 'U'}">
                    U</div>
                <div class="user-details">
                    <h2 th:text="${otherUserName}">User</h2>
                    <div class="food-tag">
                        <i class="fas fa-utensils"></i>
                        <span th:text="${foodPost.foodName}">Food</span>
                    </div>
                </div>
            </div>
            <div style="display: flex; align-items: center; gap: 8px;">
                <span style="width: 8px; height: 8px; background: #10B981; border-radius: 50%;"></span>
                <span
                    style="font-size: 0.7rem; color: #10B981; font-weight: 700; text-transform: uppercase;">Live</span>
            </div>
        </header>

        <main class="messages-viewport" id="chatViewport">
            <div th:if="${messages == null or messages.isEmpty()}" class="system-marker">Chat Started</div>
            <div th:each="msg : ${messages}"
                th:class="${msg.senderPhone.trim().equals(currentUser.phone.trim())} ? 'message-group me' : 'message-group other'">
                <div class="bubble">
                    <div th:text="${msg.message}">Message</div>
                </div>
                <div class="message-meta" th:text="${#temporals.format(msg.timestamp, 'HH:mm')}">12:00</div>
            </div>
        </main>

        <footer class="input-bar">
            <form id="chatForm">
                <div class="input-wrapper">
                    <input type="text" id="msgInput" class="message-input" placeholder="Type a message..."
                        autocomplete="off" required>
                    <button type="submit" id="submitBtn" class="send-button">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </form>
        </footer>
    </div>

    <script th:inline="javascript">
        const foodPostId = [[${ foodPost.id }]];
        const otherPhone = [[${ otherUserPhone }]].trim();
        const currentUserPhone = [[${ currentUser.phone }]].trim();
        const isRequest = [[${ isRequest }]]; // Captured from controller
        const chatViewport = document.getElementById('chatViewport');
        const chatForm = document.getElementById('chatForm');
        const msgInput = document.getElementById('msgInput');
        const submitBtn = document.getElementById('submitBtn');
        let lastMessageCount = [[${ messages != null ? messages.size() : 0}]];

        function scrollToBottom() { chatViewport.scrollTop = chatViewport.scrollHeight; }

        function appendMessage(msg, isMe) {
            const group = document.createElement('div');
            group.className = isMe ? 'message-group me' : 'message-group other';
            const time = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
            group.innerHTML = `<div class="bubble"><div>${msg.message}</div></div><div class="message-meta">${time}</div>`;
            chatViewport.appendChild(group);
            scrollToBottom();
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = msgInput.value.trim();
            if (!message) return;
            submitBtn.disabled = true;
            msgInput.value = '';
            try {
                const response = await fetch('/chat/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ foodPostId, receiverPhone: otherPhone, message, isRequest })
                });
                if (response.ok) {
                    const data = await response.json();
                    lastMessageCount++;
                    appendMessage(data.message, true);
                }
            } catch (err) { console.error(err); } finally { submitBtn.disabled = false; msgInput.focus(); }
        });

        async function pollMessages() {
            try {
                const response = await fetch(`/chat/messages/${foodPostId}?otherPhone=${otherPhone}&isRequest=${isRequest}`);
                if (response.ok) {
                    const messages = await response.json();
                    if (messages.length > lastMessageCount) {
                        messages.slice(lastMessageCount).forEach(msg => {
                            if (msg.senderPhone !== currentUserPhone) appendMessage(msg, false);
                        });
                        lastMessageCount = messages.length;
                    }
                }
            } catch (err) { }
        }
        setInterval(pollMessages, 2000);
        scrollToBottom();
    </script>
</body>

</html>
