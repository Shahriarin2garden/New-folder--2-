<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages | MUKTI APP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #10B981;
            --primary-light: #34D399;
            --primary-dark: #059669;
            --secondary: #F59E0B;
            --accent: #F97316;
            --dark: #0f172a;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-blur: blur(20px);
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.6);
            --radius-xl: 32px;
            --radius-lg: 20px;
            --radius-pill: 50px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', 'Inter', sans-serif;
        }

        body {
            background: radial-gradient(circle at bottom right, #1e293b, #0f172a);
            background-attachment: fixed;
            min-height: 100vh;
            color: var(--text-main);
            line-height: 1.6;
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .chat-header {
            padding: 32px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
        }

        .chat-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: -0.5px;
        }

        .chat-header h1 i {
            color: var(--primary-light);
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            text-decoration: none;
            padding: 10px 24px;
            border-radius: var(--radius-pill);
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            border: 1px solid var(--glass-border);
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .chat-section {
            padding: 32px 40px;
        }

        .section-title {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .conv-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .conv-item {
            display: flex;
            align-items: center;
            padding: 20px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            text-decoration: none;
            color: inherit;
            transition: all 0.3s ease;
        }

        .conv-item:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.15);
            transform: scale(1.02);
        }

        .avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 1.2rem;
            margin-right: 20px;
            flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
        }

        .avatar.receiver {
            background: linear-gradient(135deg, var(--secondary) 0%, var(--accent) 100%);
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.2);
        }

        .details {
            flex: 1;
            min-width: 0;
        }

        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .name {
            font-weight: 600;
            font-size: 1rem;
            color: white;
        }

        .time {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .food-info {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }

        .role-tag {
            font-size: 9px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 4px;
            letter-spacing: 0.5px;
        }

        .tag-donor {
            background: rgba(16, 185, 129, 0.1);
            color: var(--primary-light);
        }

        .tag-receiver {
            background: rgba(245, 158, 11, 0.1);
            color: var(--secondary);
        }

        .food-name {
            font-size: 0.85rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .last-msg {
            font-size: 0.9rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .unread-badge {
            background: var(--primary);
            color: white;
            font-size: 11px;
            font-weight: 700;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 12px;
        }

        .empty-state {
            padding: 40px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            background: rgba(255, 255, 255, 0.01);
            border-radius: var(--radius-lg);
            border: 1px dashed var(--glass-border);
        }

        @media (max-width: 600px) {

            .chat-header,
            .chat-section {
                padding: 24px;
            }
        }
    </style>
</head>

<body>
    <div class="container glass-panel fade-in">
        <header class="chat-header">
            <h1>
                <i class="fas fa-comment-dots"></i>
                Messages
            </h1>
            <a href="/dashboard" class="nav-btn">Dashboard</a>
        </header>

        <!-- Donating -->
        <div class="chat-section">
            <h2 class="section-title">Donations</h2>
            <div class="conv-list">
                <div th:if="${donations == null or donations.isEmpty()}" class="empty-state">
                    No active donation chats
                </div>

                <a th:each="conv : ${donations}"
                    th:href="@{'/chat/room/' + ${conv.foodPostId} + '?otherPhone=' + ${conv.otherUserPhone}}"
                    class="conv-item">
                    <div class="avatar"
                        th:text="${conv.otherUserName != null && !conv.otherUserName.isEmpty() ? conv.otherUserName.substring(0, 1).toUpperCase() : 'U'}">
                        U</div>
                    <div class="details">
                        <div class="top-row">
                            <span class="name" th:text="${conv.otherUserName}">User</span>
                            <span class="time" th:text="${#temporals.format(conv.lastMessageTime, 'HH:mm')}">Time</span>
                        </div>
                        <div class="food-info">
                            <span class="role-tag tag-donor">DONOR</span>
                            <span class="food-name" th:text="${conv.foodName}">Food Name</span>
                        </div>
                        <div class="last-msg" th:text="${conv.lastMessage}">Last message...</div>
                    </div>
                    <div th:if="${conv.unreadCount > 0}" class="unread-badge" th:text="${conv.unreadCount}">1</div>
                </a>
            </div>
        </div>

        <!-- Receiving -->
        <div class="chat-section" style="border-top: 1px solid var(--glass-border);">
            <h2 class="section-title">Received</h2>
            <div class="conv-list">
                <div th:if="${receivals == null or receivals.isEmpty()}" class="empty-state">
                    No active request chats
                </div>

                <a th:each="conv : ${receivals}"
                    th:href="@{'/chat/room/' + ${conv.foodPostId} + '?otherPhone=' + ${conv.otherUserPhone}}"
                    class="conv-item">
                    <div class="avatar receiver"
                        th:text="${conv.otherUserName != null && !conv.otherUserName.isEmpty() ? conv.otherUserName.substring(0, 1).toUpperCase() : 'U'}">
                        U</div>
                    <div class="details">
                        <div class="top-row">
                            <span class="name" th:text="${conv.otherUserName}">User</span>
                            <span class="time" th:text="${#temporals.format(conv.lastMessageTime, 'HH:mm')}">Time</span>
                        </div>
                        <div class="food-info">
                            <span class="role-tag tag-receiver">RECEIVER</span>
                            <span class="food-name" th:text="${conv.foodName}">Food Name</span>
                        </div>
                        <div class="last-msg" th:text="${conv.lastMessage}">Last message...</div>
                    </div>
                    <div th:if="${conv.unreadCount > 0}" class="unread-badge" th:text="${conv.unreadCount}">1</div>
                </a>
            </div>
        </div>
    </div>
</body>

</html>
