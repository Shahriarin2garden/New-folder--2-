<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Receive Food | MUKTI APP</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link th:href="@{/css/global.css}" rel="stylesheet">

    <style>
        :root {
            --primary: #10B981;
            --primary-light: #34D399;
            --primary-dark: #059669;
            --secondary: #F59E0B;
            --accent: #F97316;
            --dark: #0f172a;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-blur: blur(20px);
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.6);
            --radius-xl: 32px;
            --radius-lg: 20px;
            --radius-pill: 50px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', 'Inter', sans-serif;
        }

        body {
            background: radial-gradient(circle at top left, #1e293b, #0f172a);
            background-attachment: fixed;
            min-height: 100vh;
            color: var(--text-main);
            line-height: 1.6;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .header {
            padding: 40px;
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            gap: 24px;
            position: relative;
        }

        .back-btn {
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: white;
            transition: all 0.3s ease;
            border: 1px solid var(--glass-border);
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(-4px);
        }

        .header-content h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        .header-content p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .search-wrapper {
            margin-bottom: 32px;
            position: relative;
        }

        .search-wrapper i {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary-light);
            font-size: 1.1rem;
        }

        .search-input {
            width: 100%;
            padding: 16px 20px 16px 52px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-pill);
            color: white;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--primary-light);
        }

        .food-card {
            padding: 32px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 24px;
        }

        .food-card:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: translateY(-4px);
        }

        .food-info {
            flex: 1;
        }

        .food-info p {
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.95rem;
            color: var(--text-main);
        }

        .food-info p i {
            width: 20px;
            color: var(--primary-light);
            font-size: 1rem;
        }

        .food-info b {
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            min-width: 80px;
        }

        .food-name-tag {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: white;
            display: block;
        }

        .donor-info {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--glass-border);
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
        }

        .donor-detail {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .donor-detail a {
            color: var(--primary-light);
            text-decoration: none;
            font-weight: 600;
        }

        .receive-btn {
            background: linear-gradient(135deg, var(--secondary) 0%, var(--accent) 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: var(--radius-pill);
            cursor: pointer;
            font-weight: 700;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.2);
            white-space: nowrap;
        }

        .receive-btn:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 6px 16px rgba(245, 158, 11, 0.3);
        }

        .receive-btn:disabled {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            cursor: not-allowed;
            box-shadow: none;
        }

        .empty-state {
            text-align: center;
            padding: 64px;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        @media (max-width: 768px) {
            .food-card {
                flex-direction: column;
                align-items: stretch;
            }

            .receive-btn {
                width: 100%;
                justify-content: center;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }
    </style>
</head>

<body>
    <script th:src="@{/js/global.js}"></script>
    <div class="container fade-in">
        <header class="header glass-panel">
            <a th:href="@{/dashboard}" class="back-btn"><i class="fas fa-arrow-left"></i></a>
            <div class="header-content">
                <h1>Find Food</h1>
                <p>Browse available food donations near you.</p>
            </div>
        </header>

        <div class="search-wrapper">
            <i class="fas fa-search"></i>
            <input type="text" id="locationSearch" class="search-input" placeholder="Search by location...">
        </div>

        <div class="food-container" id="foodContainer">
            <div th:if="${foods.size() == 0}" class="empty-state glass-panel">
                <i class="fas fa-box-open"></i>
                <p>No donations available right now. Check back soon!</p>
            </div>

            <div class="food-card glass-panel fade-in" th:each="food : ${foods}" th:if="${!food.received}">
                <div class="food-info">
                    <span class="food-name-tag" th:text="${food.foodName}">Item Name</span>
                    <p><i class="fas fa-cubes"></i> <b>Quantity</b> <span th:text="${food.quantity} + ' Servings'">1
                            Servings</span></p>
                    <p><i class="fas fa-map-marker-alt"></i> <b>Location</b> <span class="location-text"
                            th:text="${food.location}">Location</span></p>
                    <p><i class="fas fa-clock"></i> <b>Cooked</b> <span
                            th:text="${#temporals.format(food.cookTime, 'dd MMM, hh:mm a')}">Time</span></p>
                    <p><i class="fas fa-hourglass-end"></i> <b>Expires</b> <span
                            th:text="${#temporals.format(food.expireTime, 'dd MMM, hh:mm a')}">Time</span></p>

                    <div class="donor-info">
                        <span class="donor-detail"><i class="fas fa-user-circle"></i> Donor: <span
                                th:text="${food.donorName != null && food.donorName != '' ? food.donorName : 'Anonymous'}">Donor</span></span>
                        <span class="donor-detail"><i class="fas fa-phone"></i> Contact: <a
                                th:href="'tel:' + ${food.donorPhone}"
                                th:text="${food.donorPhone != null ? food.donorPhone : 'No Number'}">01XXXXXXX</a></span>
                    </div>
                </div>

                <button class="receive-btn" th:id="'btn-' + ${food.id}" th:onclick="'receiveFood(' + ${food.id} + ')'">
                    <i class="fas fa-hand-holding-heart"></i> <span th:id="'text-' + ${food.id}">Receive</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('locationSearch').addEventListener('input', function () {
            let input = this.value.toLowerCase();
            let cards = document.getElementsByClassName('food-card');
            for (let i = 0; i < cards.length; i++) {
                let locationTag = cards[i].querySelector('.location-text');
                if (locationTag) {
                    let locationValue = locationTag.textContent.toLowerCase();
                    cards[i].style.display = locationValue.includes(input) ? "flex" : "none";
                }
            }
        });

        window.receiveFood = async function (id) {
            const btn = document.getElementById('btn-' + id);
            const text = document.getElementById('text-' + id);
            if (confirm("Do you want to request this food? Please make sure you can collect it.")) {
                btn.disabled = true;
                text.innerText = 'Processing...';
                try {
                    const response = await fetch('/food/receive/' + id, { method: 'POST' });
                    if (response.ok) {
                        btn.style.background = "#10B981";
                        text.innerText = 'Success!';
                        alert("Success! The food is yours. Please call the donor to coordinate collection.");
                        setTimeout(() => location.reload(), 1500);
                    } else {
                        alert("Something went wrong. Please try again.");
                        btn.disabled = false;
                        text.innerText = "Receive";
                    }
                } catch (e) {
                    alert("Connection error.");
                    btn.disabled = false;
                    text.innerText = "Receive";
                }
            }
        };
    </script>
</body>

</html>
