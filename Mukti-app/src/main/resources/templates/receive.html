<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Receive Food | MUKTI APP</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #10B981;
            --primary-light: #34D399;
            --primary-dark: #059669;
            --secondary: #F59E0B;
            --accent: #F97316;
            --dark: #1F2937;
            --light: #F9FAFB;
            --gradient: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            --gradient-warm: linear-gradient(135deg, #F59E0B 0%, #F97316 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background:
                linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.8)),
                url('https://images.unsplash.com/photo-1504674900247-0877df9cc836?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=2070&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            color: white;
            padding: 30px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }

        .back-btn {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            text-decoration: none;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-50%) translateX(-5px);
        }

        h2 {
            font-size: 2.5rem;
            font-weight: 700;
            color: white;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        h2 i {
            color: var(--secondary);
            font-size: 2.2rem;
        }

        /* Search Bar */
        .search-wrapper {
            max-width: 700px;
            margin: 0 auto 40px;
            position: relative;
        }

        .search-wrapper i {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.1rem;
            z-index: 2;
        }

        .search-input {
            width: 100%;
            padding: 16px 20px 16px 50px;
            background: rgba(255, 255, 255, 0.12);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            font-size: 1rem;
            color: white;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .search-input:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.18);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
        }

        /* Food Container */
        .food-container {
            max-width: 900px;
            margin: 0 auto 50px;
        }

        .food-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }

        .food-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--gradient);
        }

        .food-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }

        .food-info {
            flex: 1;
        }

        .food-info p {
            margin: 12px 0;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1rem;
        }

        .food-info b {
            color: rgba(255, 255, 255, 0.9);
            min-width: 100px;
            font-weight: 600;
            display: inline-block;
        }

        .food-info span {
            color: white;
            font-weight: 500;
        }

        .location-text {
            color: var(--primary-light);
            font-weight: 600;
        }

        /* Icons for different info */
        .food-info p i.fa-utensils { color: #F59E0B; }
        .food-info p i.fa-cubes { color: #3B82F6; }
        .food-info p i.fa-map-marker-alt { color: #EF4444; }
        .food-info p i.fa-clock { color: #6B7280; }
        .food-info p i.fa-hourglass-end { color: #EF4444; }
        .food-info p i.fa-user-circle { color: #10B981; }
        .food-info p i.fa-phone-alt { color: #10B981; }

        /* Donor Section */
        .donor-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px dashed rgba(255, 255, 255, 0.1);
        }

        .donor-detail {
            color: white;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .donor-detail a {
            color: var(--primary-light);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .donor-detail a:hover {
            color: var(--secondary);
            text-decoration: underline;
        }

        /* Receive Button */
        .receive-btn {
            background: var(--gradient-warm);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.2);
            min-width: 180px;
            justify-content: center;
        }

        .receive-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #FBBF24 0%, #F59E0B 100%);
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.3);
        }

        .receive-btn:disabled {
            background: #6B7280;
            cursor: not-allowed;
            opacity: 0.7;
            transform: none !important;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 2px dashed rgba(255, 255, 255, 0.2);
            margin: 40px 0;
        }

        .empty-state i {
            font-size: 4rem;
            color: rgba(255, 255, 255, 0.2);
            margin-bottom: 20px;
        }

        .empty-state p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.2rem;
        }

        /* Back Link */
        .back-link {
            display: block;
            text-align: center;
            margin-top: 40px;
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            padding: 15px 30px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            max-width: 300px;
            margin-left: auto;
            margin-right: auto;
        }

        .back-link:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-3px);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 20px 15px;
            }

            h2 {
                font-size: 2rem;
                flex-direction: column;
                gap: 10px;
            }

            .back-btn {
                position: relative;
                display: inline-block;
                margin-bottom: 20px;
                transform: none;
                top: 0;
            }

            .food-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 25px;
            }

            .receive-btn {
                width: 100%;
            }

            .food-info b {
                min-width: 90px;
            }
        }

        @media (max-width: 480px) {
            h2 {
                font-size: 1.8rem;
            }

            .search-input {
                padding: 14px 20px 14px 45px;
                font-size: 0.95rem;
            }

            .food-card {
                padding: 25px 20px;
            }

            .food-info p {
                font-size: 0.95rem;
                flex-wrap: wrap;
            }

            .empty-state {
                padding: 40px 20px;
            }
        }

        /* Animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }
    </style>
</head>

<body>
<div class="container">
    <!-- Header -->
    <div class="header">
        <a th:href="@{/dashboard}" class="back-btn">
            <i class="fas fa-arrow-left"></i> Dashboard
        </a>
        <h2><i class="fas fa-hand-holding-heart"></i> Available Food Donations</h2>
    </div>

    <!-- Search Bar -->
    <div class="search-wrapper fade-in">
        <i class="fas fa-search"></i>
        <input type="text" id="locationSearch" class="search-input"
               placeholder="Search by location (e.g., Mirpur, Gulshan, Dhanmondi)...">
    </div>

    <!-- Food Container -->
    <div class="food-container" id="foodContainer">
        <!-- Empty State -->
        <div th:if="${foods.size() == 0}" class="empty-state fade-in">
            <i class="fas fa-box-open"></i>
            <p>No food available right now. Check back soon or consider donating!</p>
        </div>

        <!-- Food Cards -->
        <div class="food-card fade-in" th:each="food : ${foods}" th:if="${!food.received}">
            <div class="food-info">
                <p><i class="fas fa-utensils"></i> <b>Food:</b> <span th:text="${food.foodName}">Item Name</span></p>
                <p><i class="fas fa-cubes"></i> <b>Quantity:</b> <span th:text="${food.quantity} + ' Servings'">1 Servings</span></p>
                <p><i class="fas fa-map-marker-alt"></i> <b>Location:</b> <span class="location-text" th:text="${food.location}">Location</span></p>
                <p><i class="fas fa-clock"></i> <b>Cooked:</b> <span th:text="${#temporals.format(food.cookTime, 'dd MMM, hh:mm a')}">Time</span></p>
                <p><i class="fas fa-hourglass-end"></i> <b>Expires:</b> <span th:text="${#temporals.format(food.expireTime, 'dd MMM, hh:mm a')}">Time</span></p>

                <div class="donor-section">
                    <p class="donor-detail">
                        <i class="fas fa-user-circle"></i>
                        Donor: <span th:text="${food.donorName != null && food.donorName != '' ? food.donorName : 'Anonymous'}">Donor Name</span>
                    </p>
                    <p class="donor-detail">
                        <i class="fas fa-phone-alt"></i>
                        Contact: <a th:href="'tel:' + ${food.donorPhone}" th:text="${food.donorPhone != null ? food.donorPhone : 'No Number'}">01XXXXXXX</a>
                    </p>
                </div>
            </div>

            <button class="receive-btn" th:id="'btn-' + ${food.id}" th:onclick="'receiveFood(' + ${food.id} + ')'">
                <i class="fas fa-check-circle"></i> <span th:id="'text-' + ${food.id}">Receive Food</span>
            </button>
        </div>
    </div>

    <a th:href="@{/dashboard}" class="back-link">← Back to Dashboard</a>
</div>

<script>
    // Search Function - Fixed
    document.getElementById('locationSearch').addEventListener('input', function() {
        let input = this.value.toLowerCase();
        let cards = document.getElementsByClassName('food-card');

        for (let i = 0; i < cards.length; i++) {
            let locationTag = cards[i].querySelector('.location-text');
            if (locationTag) {
                let locationValue = locationTag.textContent.toLowerCase();
                if (locationValue.includes(input)) {
                    cards[i].style.display = "flex";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }
    });

    // Receive Food Function
    window.receiveFood = async function(id) {
        const btn = document.getElementById('btn-' + id);
        const text = document.getElementById('text-' + id);

        if(confirm("Do you want to request this food? Please make sure you can collect it.")) {
            btn.disabled = true;
            text.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';

            try {
                const response = await fetch('/food/receive/' + id, { method: 'POST' });
                if (response.ok) {
                    // Change button to success state
                    btn.style.background = "linear-gradient(135deg, #059669 0%, #047857 100%)";
                    text.innerHTML = '<i class="fas fa-check"></i> Success!';

                    alert("Success! The food is yours. Please call the donor to coordinate collection.");

                    // Reload page after 2 seconds
                    setTimeout(() => {
                        location.reload();
                    }, 2000);
                } else {
                    alert("Something went wrong. Please try again.");
                    btn.disabled = false;
                    text.innerHTML = "Receive Food";
                }
            } catch (e) {
                alert("Connection error. Please check your internet connection.");
                btn.disabled = false;
                text.innerHTML = "Receive Food";
            }
        }
    };

    // Add input focus effect
    document.getElementById('locationSearch').addEventListener('focus', function() {
        this.parentElement.style.transform = 'translateY(-3px)';
    });

    document.getElementById('locationSearch').addEventListener('blur', function() {
        this.parentElement.style.transform = 'translateY(0)';
    });

    // Add animation to cards
    document.addEventListener('DOMContentLoaded', function() {
        const cards = document.querySelectorAll('.food-card');
        cards.forEach((card, index) => {
            card.style.animationDelay = (index * 0.1) + 's';
        });

        // Add keyboard shortcut for search (Ctrl+F)
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'f') {
                e.preventDefault();
                document.getElementById('locationSearch').focus();
            }
        });
    });
</script>
</body>
</html>
